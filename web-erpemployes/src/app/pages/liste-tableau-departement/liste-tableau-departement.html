<p-toast />
<p-confirmDialog />

<div class="card">
    <!-- En-tête : titre + bouton Nouveau -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-semibold m-0">Départements</h2>
        <p-button
            label="Nouveau département"
            icon="pi pi-plus"
            (onClick)="ouvrirNouveau()" />
    </div>

    <!-- Tableau -->
    <p-table
        [value]="departements()"
        [loading]="loading()"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[5, 10, 25]"
        [tableStyle]="{ 'min-width': '50rem' }"
        styleClass="p-datatable-striped">

        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="nom">Nom <p-sortIcon field="nom" /></th>
                <th pSortableColumn="entreprise">Entreprise <p-sortIcon field="entreprise" /></th>
                <th pSortableColumn="effectif">Effectif <p-sortIcon field="effectif" /></th>
                <th style="width: 120px;">Actions</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-dept>
            <tr>
                <td>{{ dept.nom }}</td>
                <td>{{ dept.entreprise }}</td>
                <td>{{ dept.effectif }}</td>
                <td>
                    <div class="flex gap-2">
                        <p-button
                            icon="pi pi-pencil"
                            severity="info"
                            [text]="true"
                            [rounded]="true"
                            (onClick)="ouvrirEdition(dept)" />
                        <p-button
                            icon="pi pi-trash"
                            severity="danger"
                            [text]="true"
                            [rounded]="true"
                            (onClick)="confirmerSuppression(dept)" />
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center py-8 text-gray-500">
                    Aucun département pour le moment
                </td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Pied : Total -->
    <div class="mt-4 text-right text-gray-600">
        Total : {{ departements().length }} départements
    </div>
</div>

<!-- Dialog d'ajout/modification -->
<p-dialog
    [header]="modeEdition() ? 'Modifier le département' : 'Nouveau département'"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }">

    <div class="flex flex-col gap-4">
        
        <div class="flex flex-col gap-2">
            <label for="nom" class="font-semibold">Nom *</label>
            <input
                pInputText
                id="nom"
                [ngModel]="form().nom"
                (ngModelChange)="updateForm('nom', $event)"
                placeholder="Ex: Ressources Humaines" />
        </div>

        <div class="flex flex-col gap-2">
            <label for="entreprise" class="font-semibold">Entreprise</label>
            <input
                pInputText
                id="entreprise"
                [ngModel]="form().entreprise"
                (ngModelChange)="updateForm('entreprise', $event)"
                placeholder="Ex: Sakai Group" />
        </div>

        <div class="flex flex-col gap-2">
            <label for="effectif" class="font-semibold">Effectif</label>
            <p-inputNumber
                inputId="effectif"
                [ngModel]="form().effectif"
                (ngModelChange)="updateForm('effectif', $event)"
                [min]="0" />
        </div>

    </div>

    <ng-template pTemplate="footer">
        <p-button
            label="Annuler"
            severity="secondary"
            [text]="true"
            (onClick)="dialogVisible.set(false)" />
        <p-button
            label="Enregistrer"
            icon="pi pi-check"
            (onClick)="enregistrer()" />
    </ng-template>
</p-dialog>
