# Local development stack.
#   docker compose up db        -> PostgreSQL only, run Django from your venv
#   docker compose up           -> PostgreSQL + API on http://localhost:8000
services:
  db:
    # PostgreSQL with the pgvector extension, needed later for legal sources.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    # Host port 5434 by default, to avoid PostgreSQL servers already running on
    # 5432/5433. Override with DB_PORT and match it in rest-erpemployes/.env.
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./rest-erpemployes
      args:
        REQUIREMENTS: requirements-dev.txt
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY: local-development-only-not-secret-but-long-enough
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://app:app@db:5432/app
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8000:8000"
    volumes:
      - ./rest-erpemployes:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
