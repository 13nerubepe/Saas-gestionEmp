name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rest-erpemployes
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret-but-long-enough-for-jwt-signing
      DATABASE_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: rest-erpemployes/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-erpemployes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-erpemployes/package-lock.json
      # The lockfile is written by npm 11 (developer machines); npm 10, bundled
      # with Node 22, reads it as out of sync.
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - name: Production build
        run: npx ng build --configuration production
