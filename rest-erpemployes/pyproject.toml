[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["venv", "migrations"]

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, DJ: Django pitfalls
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = [
    # WhiteNoise: STATIC_ROOT only exists after collectstatic (done in the Docker image).
    "ignore:No directory at:UserWarning",
]
