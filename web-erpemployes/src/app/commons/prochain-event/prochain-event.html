
<div class="h-full rounded-2xl border border-surface-200 bg-white p-5 shadow-sm dark:border-surface-700 dark:bg-surface-900 md:p-6">

    <!-- En-tête -->
    <div class="flex items-center justify-between gap-3">
        <div>
            <h3 class="m-0 text-lg font-semibold text-surface-900 dark:text-surface-0">
                Prochains événements
            </h3>
            <p class="mb-0 mt-1 text-sm text-surface-500 dark:text-surface-400">
                Suivez les activités de votre équipe
            </p>
        </div>

        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-orange-50 text-orange-600 dark:bg-orange-950 dark:text-orange-300">
            <i class="pi pi-calendar text-xl"></i>
        </div>
    </div>

    <!-- Compteur -->
    <div class="mt-5 flex items-center justify-between rounded-xl border border-surface-200 bg-surface-50 px-4 py-3 dark:border-surface-700 dark:bg-surface-800">
        <div class="flex items-center gap-2">
            <i class="pi pi-clock text-orange-500"></i>
            <span class="text-sm text-surface-600 dark:text-surface-300">
                Événements à venir
            </span>
        </div>

        <p-tag
            value="3 événements"
            severity="secondary"
            [rounded]="true">
        </p-tag>
    </div>

    <!-- Liste des événements -->
    <div class="mt-5 flex flex-col">

        <!-- Congé -->
        <div class="flex items-start gap-3 border-b border-surface-200 py-4 first:pt-0 dark:border-surface-700">

            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-950 dark:text-blue-300">
                <i class="pi pi-calendar text-lg"></i>
            </div>

            <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                    <h4 class="m-0 text-sm font-semibold text-surface-900 dark:text-surface-0">
                        Congé de Marie Dupont
                    </h4>

                    <p-tag
                        value="Congé"
                        severity="info"
                        [rounded]="true">
                    </p-tag>
                </div>

                <div class="mt-2 flex items-center gap-2 text-sm text-surface-500 dark:text-surface-400">
                    <i class="pi pi-calendar text-xs"></i>
                    <span>Du 12 au 16 octobre 2026</span>
                </div>
            </div>
        </div>

        <!-- Absence -->
        <div class="flex items-start gap-3 border-b border-surface-200 py-4 dark:border-surface-700">

            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-orange-50 text-orange-600 dark:bg-orange-950 dark:text-orange-300">
                <i class="pi pi-user-minus text-lg"></i>
            </div>

            <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                    <h4 class="m-0 text-sm font-semibold text-surface-900 dark:text-surface-0">
                        Absence de Jean Kamga
                    </h4>

                    <p-tag
                        value="Absence"
                        severity="warn"
                        [rounded]="true">
                    </p-tag>
                </div>

                <div class="mt-2 flex items-center gap-2 text-sm text-surface-500 dark:text-surface-400">
                    <i class="pi pi-clock text-xs"></i>
                    <span>Aujourd'hui</span>
                </div>
            </div>
        </div>

        <!-- Réunion -->
        <div class="flex items-start gap-3 py-4 last:pb-0">

            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-purple-50 text-purple-600 dark:bg-purple-950 dark:text-purple-300">
                <i class="pi pi-users text-lg"></i>
            </div>

            <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                    <h4 class="m-0 text-sm font-semibold text-surface-900 dark:text-surface-0">
                        Réunion équipe RH
                    </h4>

                    <p-tag
                        value="Réunion"
                        severity="secondary"
                        [rounded]="true">
                    </p-tag>
                </div>

                <div class="mt-2 flex items-center gap-2 text-sm text-surface-500 dark:text-surface-400">
                    <i class="pi pi-clock text-xs"></i>
                    <span>Demain à 10 h 00</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Pied de carte -->
    <div class="mt-4 border-t border-surface-200 pt-4 dark:border-surface-700">
        <button
            pButton
            type="button"
            label="Voir tous les événements"
            icon="pi pi-arrow-right"
            iconPos="right"
            [text]="true"
            severity="secondary"
            class="!w-full !justify-between !px-0">
        </button>
    </div>

</div>
`
