# Production stack, on one server:
#   Caddy (HTTPS, Angular files, proxy) -> Django/gunicorn -> PostgreSQL
#
# Run from this folder, with deploy/.env filled in (see .env.example):
#   docker compose -f docker-compose.prod.yml up -d --build
# Full procedure: deploy/README.md.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No published port: the database is only reachable by the api service.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../rest-erpemployes
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALLOWED_HOSTS: ${APP_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN}
      DEBUG: "False"
    # Migrations run on every start; they are a no-op when nothing changed.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 90 --access-logfile -"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Angular build output, uploaded by deploy.sh.
      - ./frontend:/srv:ro
      # Certificates: keep them, or Let's Encrypt rate limits apply on redeploy.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
